version: '3.8'

services:
  backend:
    build: ./backend
    container_name: virtual-wiscard-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-db:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/virtual_wiscard.db
    command: sh -c "python init_db.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - wiscard-network

  frontend:
    build: ./frontend
    container_name: virtual-wiscard-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - wiscard-network

volumes:
  backend-db:

networks:
  wiscard-network:
    driver: bridge

